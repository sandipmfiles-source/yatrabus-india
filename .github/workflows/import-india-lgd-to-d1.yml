name: Import India LGD directory into Cloudflare D1

on:
  pull_request:
    paths:
      - 'scripts/import-india-lgd-to-d1.mjs'
      - '.github/workflows/import-india-lgd-to-d1.yml'
      - 'src/components/home/HomeScreen.tsx'
      - 'src/types/index.ts'
  push:
    branches: [main]
    paths:
      - 'scripts/import-india-lgd-to-d1.mjs'
      - '.github/workflows/import-india-lgd-to-d1.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Confirm append-only import of the pinned India LGD administrative snapshot into production D1'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate importer syntax and safety rules
        run: |
          set -euo pipefail
          node --check scripts/import-india-lgd-to-d1.mjs
          node scripts/import-india-lgd-to-d1.mjs --self-test
      - name: Dry-run the pinned full India LGD snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/yatrabus-lgd
          curl --fail --location --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/sandipmfiles-source/yatrabus-india/1056c20c32457a1d3b8f7a7a124e574dc4d5c64b/backend/data/india-lgd-directory.json.gz' \
            --output /tmp/yatrabus-lgd/india-lgd-directory.json.gz
          gzip --test /tmp/yatrabus-lgd/india-lgd-directory.json.gz
          actual="$(git hash-object /tmp/yatrabus-lgd/india-lgd-directory.json.gz)"
          expected='b9c7719f7f4f0d84eff12e62d4078791f6b13e74'
          test "$actual" = "$expected"
          node scripts/import-india-lgd-to-d1.mjs \
            --input /tmp/yatrabus-lgd/india-lgd-directory.json.gz \
            --output-dir /tmp/yatrabus-lgd/dry-run
          test -s /tmp/yatrabus-lgd/dry-run/manifest.json
      - name: Run application tests and production build
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

  import:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Download pinned India LGD snapshot and verify its Git object hash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yatrabus-lgd
          curl --fail --location --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/sandipmfiles-source/yatrabus-india/1056c20c32457a1d3b8f7a7a124e574dc4d5c64b/backend/data/india-lgd-directory.json.gz' \
            --output /tmp/yatrabus-lgd/india-lgd-directory.json.gz
          gzip --test /tmp/yatrabus-lgd/india-lgd-directory.json.gz
          actual="$(git hash-object /tmp/yatrabus-lgd/india-lgd-directory.json.gz)"
          expected='b9c7719f7f4f0d84eff12e62d4078791f6b13e74'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned LGD snapshot hash mismatch."
            exit 1
          fi
          echo "Pinned LGD snapshot integrity verified."
      - name: Validate snapshot and generate append-only SQL batches
        run: |
          set -euo pipefail
          node scripts/import-india-lgd-to-d1.mjs \
            --input /tmp/yatrabus-lgd/india-lgd-directory.json.gz \
            --output-dir /tmp/yatrabus-lgd/sql
          test -s /tmp/yatrabus-lgd/sql/manifest.json
          ls -lh /tmp/yatrabus-lgd/sql
      - name: Import India administrative places into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in /tmp/yatrabus-lgd/sql/lgd-*.sql; do
            echo "Applying $(basename "$file")"
            npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --file="$file"
          done
      - name: Verify imported LGD rows without modifying existing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes \
            --command="SELECT place_type, COUNT(*) AS records FROM places WHERE source_dataset = 'INDIA_LGD' GROUP BY place_type ORDER BY place_type;"
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes \
            --command="SELECT COUNT(*) AS total_india_lgd_places FROM places WHERE source_dataset = 'INDIA_LGD';"
