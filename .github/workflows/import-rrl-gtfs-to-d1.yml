name: Import Rajkot RRL GTFS into Cloudflare D1

on:
  pull_request:
    paths:
      - 'scripts/import-rrl-gtfs-to-d1.py'
      - '.github/workflows/import-rrl-gtfs-to-d1.yml'
      - 'docs/TRANSIT_DATA_COVERAGE.md'
  push:
    branches: [main, feat/rajkot-rrl-gtfs-import]
    paths:
      - 'scripts/import-rrl-gtfs-to-d1.py'
      - '.github/workflows/import-rrl-gtfs-to-d1.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Confirm idempotent import and calendar enrichment of the pinned Rajkot community GTFS snapshot into production D1'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'yatrabus-d1-production' || format('yatrabus-d1-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/rajkot-rrl-gtfs-import')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate importer and synthetic GTFS fixture
        run: |
          set -euo pipefail
          python -m py_compile scripts/import-rrl-gtfs-to-d1.py
          python scripts/import-rrl-gtfs-to-d1.py --self-test
      - name: Download and checksum-pin RRL community GTFS archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/rrl
          curl --fail --location --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/croyla/rrl-gtfs/3937952038f7fa052a019418d064991cfa14a2fe/gtfs_compat.zip' \
            --output /tmp/rrl/gtfs.zip
          actual="$(git hash-object /tmp/rrl/gtfs.zip)"
          expected='46120d883177efd6be81e8e95a69d5d7136084c9'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned RRL GTFS archive hash mismatch."
            exit 1
          fi
          python scripts/import-rrl-gtfs-to-d1.py --input /tmp/rrl/gtfs.zip --output-dir /tmp/rrl/sql
          python - <<'PY'
          import json
          m=json.load(open('/tmp/rrl/sql/manifest.json'))
          assert m['stopCount'] >= 10, m
          assert m['routePatternCount'] >= 1, m
          assert m['tripCount'] >= 10, m
          assert m['liveGpsIncluded'] is False and m['fareDataIncluded'] is False and m['vehicleRecordsCreated'] == 0
          print(json.dumps(m, indent=2))
          PY
      - name: Run app tests and production build
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

  import:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply pending versioned D1 migrations before import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply yatrabus-india-db --remote
      - name: Download and checksum-pin RRL community GTFS archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/rrl
          curl --fail --location --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/croyla/rrl-gtfs/3937952038f7fa052a019418d064991cfa14a2fe/gtfs_compat.zip' \
            --output /tmp/rrl/gtfs.zip
          actual="$(git hash-object /tmp/rrl/gtfs.zip)"
          expected='46120d883177efd6be81e8e95a69d5d7136084c9'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Pinned RRL GTFS archive hash mismatch."
            exit 1
          fi
          python scripts/import-rrl-gtfs-to-d1.py --input /tmp/rrl/gtfs.zip --output-dir /tmp/rrl/sql
      - name: Import RRL stops, routes and timetable rows (idempotent source-preserving upsert)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in /tmp/rrl/sql/rrl-*.sql; do
            echo "Applying $(basename "$file")"
            npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --file="$file"
          done
      - name: Verify Rajkot records and ensure no invented vehicles or fares
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg sql "SELECT (SELECT COUNT(*) FROM places WHERE source_dataset = 'RRL_RAJKOT_GTFS_2026_11_16') AS stops, (SELECT COUNT(*) FROM routes WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%') AS routes, (SELECT COUNT(*) FROM timetables WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%') AS trips, (SELECT COUNT(*) FROM route_stops WHERE route_id IN (SELECT id FROM routes WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%')) AS route_stops, (SELECT COUNT(*) FROM timetables WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%' AND service_start_date IS NOT NULL AND service_end_date IS NOT NULL) AS calendar_rows, (SELECT COUNT(*) FROM buses WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%') AS vehicles, (SELECT COUNT(*) FROM timetables WHERE payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%' AND json_extract(payload_json, '$.fareInRupees') IS NOT NULL) AS invented_fares;" '{sql: $sql}')"
          response="$(curl --fail --silent --show-error \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/ad817522-9239-4574-8b23-17b8d45d756e/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null
          stops="$(printf '%s' "$response" | jq -er '.result[0].results[0].stops')"
          routes="$(printf '%s' "$response" | jq -er '.result[0].results[0].routes')"
          trips="$(printf '%s' "$response" | jq -er '.result[0].results[0].trips')"
          route_stops="$(printf '%s' "$response" | jq -er '.result[0].results[0].route_stops')"
          calendar_rows="$(printf '%s' "$response" | jq -er '.result[0].results[0].calendar_rows')"
          vehicles="$(printf '%s' "$response" | jq -er '.result[0].results[0].vehicles')"
          fares="$(printf '%s' "$response" | jq -er '.result[0].results[0].invented_fares')"
          if [ "$stops" -lt 10 ] || [ "$routes" -lt 1 ] || [ "$trips" -lt 10 ] || [ "$route_stops" -lt 100 ] || [ "$calendar_rows" -lt 100 ] || [ "$vehicles" -ne 0 ] || [ "$fares" -ne 0 ]; then
            echo "::error::RRL D1 verification failed: stops=$stops routes=$routes trips=$trips route_stops=$route_stops calendar_rows=$calendar_rows vehicles=$vehicles fares=$fares"
            exit 1
          fi
          echo "Verified Rajkot RRL feed: $stops stops, $routes route patterns, $trips scheduled trips and $route_stops indexed stop positions; $calendar_rows timetables with verified GTFS calendar ranges; no individual vehicles or fares invented."

      - name: Smoke-test date-aware production route search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sql="WITH RECURSIVE dates(service_date,days_ahead) AS (SELECT date('now','+5 hours 30 minutes'),0 UNION ALL SELECT date(service_date,'+1 day'),days_ahead+1 FROM dates WHERE days_ahead<60) SELECT board.stop_id AS origin, alight.stop_id AS destination, candidate.service_date AS service_date FROM route_stops AS board JOIN route_stops AS alight ON alight.route_id=board.route_id AND alight.stop_sequence>board.stop_sequence JOIN routes AS r ON r.id=board.route_id JOIN timetables AS t ON t.route_id=r.id JOIN dates AS candidate WHERE r.payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%' AND t.payload_json LIKE '%RRL_RAJKOT_GTFS_2026_11_16%' AND t.service_start_date <= candidate.service_date AND t.service_end_date >= candidate.service_date AND (EXISTS (SELECT 1 FROM json_each(t.service_days_json) AS weekly WHERE weekly.value=CASE strftime('%w',candidate.service_date) WHEN '0' THEN 'Sun' WHEN '1' THEN 'Mon' WHEN '2' THEN 'Tue' WHEN '3' THEN 'Wed' WHEN '4' THEN 'Thu' WHEN '5' THEN 'Fri' WHEN '6' THEN 'Sat' END) OR EXISTS (SELECT 1 FROM json_each(t.service_exceptions_json) AS added WHERE json_extract(added.value,'$.date')=candidate.service_date AND CAST(json_extract(added.value,'$.exceptionType') AS INTEGER)=1)) AND NOT EXISTS (SELECT 1 FROM json_each(t.service_exceptions_json) AS removed WHERE json_extract(removed.value,'$.date')=candidate.service_date AND CAST(json_extract(removed.value,'$.exceptionType') AS INTEGER)=2) ORDER BY candidate.service_date LIMIT 1;"
          payload="$(jq -n --arg sql "$sql" '{sql: $sql}')"
          d1_response="$(curl --fail --silent --show-error --request POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/ad817522-9239-4574-8b23-17b8d45d756e/query" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data "$payload")"
          printf '%s' "$d1_response" | jq -e '.success == true' >/dev/null
          origin="$(printf '%s' "$d1_response" | jq -er '.result[0].results[0].origin')"
          destination="$(printf '%s' "$d1_response" | jq -er '.result[0].results[0].destination')"
          service_date="$(printf '%s' "$d1_response" | jq -er '.result[0].results[0].service_date')"
          health_url="https://yatrabus-india.pages.dev/api/v1/health"
          ready=false
          for attempt in $(seq 1 30); do
            health="$(curl --silent --show-error "$health_url" || true)"
            if printf '%s' "$health" | jq -e '.success == true and .data.timetableCalendarReady == true' >/dev/null 2>&1; then
              ready=true
              break
            fi
            echo "Waiting for date-aware Pages deployment (attempt $attempt/30)."
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::Date-aware production Pages API did not become healthy."
            printf '%s\n' "$health"
            exit 1
          fi
          search_response="$(curl --fail --silent --show-error --get --data-urlencode "origin=$origin" --data-urlencode "destination=$destination" --data-urlencode "date=$service_date" "https://yatrabus-india.pages.dev/api/v1/routes/search")"
          printf '%s' "$search_response" | jq -e '.success == true and (.data.directRoutes | length > 0)' >/dev/null
          echo "Date-aware production route search passed for service date $service_date."
