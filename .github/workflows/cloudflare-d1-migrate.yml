name: Apply Cloudflare D1 migration

on:
  push:
    branches: [main]
    paths:
      - 'migrations/0002_admin_security.sql'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm applying the YatraBus schema to the production D1 database"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'push' || inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable before running this workflow."
            exit 1
          fi
          test -s migrations/0001_initial.sql
          test -s migrations/0002_admin_security.sql

      - name: Apply schema to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Applying additive owner-security migration"
            npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --file=migrations/0002_admin_security.sql
          else
            for migration in migrations/*.sql; do
              echo "Applying $migration"
              npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --file="$migration"
            done
          fi

      - name: Verify YatraBus tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --command="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('places','operators','buses','routes','timetables','journey_sessions','location_observations','community_submissions','audit_logs','automation_rules','schema_migrations','admin_sessions','admin_login_attempts','operator_claims','service_alerts','public_rate_limits') ORDER BY name;"
