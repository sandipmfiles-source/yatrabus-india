name: Apply Cloudflare D1 migration

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm applying the YatraBus schema to the production D1 database"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable before running this workflow."
            exit 1
          fi
          test -s migrations/0001_initial.sql

      - name: Apply schema to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --file=migrations/0001_initial.sql

      - name: Verify YatraBus tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --command="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('places','operators','buses','routes','timetables','journey_sessions','location_observations','community_submissions','audit_logs','automation_rules','schema_migrations') ORDER BY name;"
