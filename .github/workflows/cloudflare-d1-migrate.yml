name: Apply Cloudflare D1 migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/*.sql'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-d1-migrate.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm applying pending versioned migrations to production D1"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'push' || inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required Cloudflare credentials and migration files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          compgen -G "migrations/*.sql" >/dev/null
          grep -q 'migrations_dir = "migrations"' wrangler.toml

      - name: Apply pending versioned migrations to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list yatrabus-india-db --remote
          npx --yes wrangler@4 d1 migrations apply yatrabus-india-db --remote

      - name: Verify all core and owner-security tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --command="SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('places','operators','buses','routes','route_stops','timetables','journey_sessions','location_observations','community_submissions','audit_logs','automation_rules','schema_migrations','admin_sessions','admin_login_attempts','operator_claims','service_alerts','public_rate_limits') ORDER BY name;"
          npx --yes wrangler@4 d1 execute yatrabus-india-db --remote --yes --command="SELECT COUNT(*) AS indexed_route_stops FROM route_stops;"
