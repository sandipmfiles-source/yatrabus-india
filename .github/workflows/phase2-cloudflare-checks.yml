name: Phase 2 Cloudflare API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase2-cloudflare-pages-d1, feat/super-admin-pages-api]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'yatrabus-d1-production' || format('yatrabus-phase2-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |file| YAML.load_file(file, aliases: true); puts "YAML OK: #{file}" }'
      - name: Validate production D1 smoke-test shell syntax
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          workflow = YAML.load_file('.github/workflows/import-rrl-gtfs-to-d1.yml', aliases: true)
          step = workflow.fetch('jobs').fetch('import').fetch('steps').find { |item| item['name'] == 'Smoke-test date-aware production route search' }
          abort('Missing date-aware production smoke-test step') unless step && step['run']
          File.write('/tmp/yatrabus-date-search-smoke.sh', step['run'])
          RUBY
          bash -n /tmp/yatrabus-date-search-smoke.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Deploy the tested build to the Cloudflare Pages production branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          project_file="$(mktemp)"
          project_status="$(curl --silent --show-error --output "$project_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yatrabus-india" || true)"
          if [ "$project_status" != "200" ]; then
            echo "::warning::Direct Pages deployment skipped: current Cloudflare token cannot read Pages project settings (HTTP $project_status). A token with Cloudflare Pages Read/Edit or dashboard access is required."
            exit 0
          fi
          project="$(cat "$project_file")"
          production_branch="$(printf '%s' "$project" | jq -er '.result.production_branch')"
          echo "Cloudflare Pages production branch: $production_branch"
          if [ "$production_branch" != "main" ]; then
            echo "Updating the approved YatraBus production branch to main."
            payload="$(jq -n '{production_branch: "main"}')"
            patch_status="$(curl --silent --show-error --output "$project_file" --write-out '%{http_code}' --request PATCH \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yatrabus-india" || true)"
            if [ "$patch_status" != "200" ]; then
              echo "::warning::Could not update Pages production branch (HTTP $patch_status); direct deployment skipped."
              exit 0
            fi
          fi
          if ! npx --yes wrangler@4 pages deploy dist --project-name yatrabus-india --branch main; then
            echo "::warning::Wrangler Pages deployment was not authorized. Grant Cloudflare Pages Edit to CLOUDFLARE_API_TOKEN or connect the Cloudflare dashboard."
          fi
      - name: Apply pending production D1 migrations before smoke tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 migrations apply yatrabus-india-db --remote

      - name: Smoke-test live production data, place suggestions and route directory
        shell: bash
        run: |
          set -euo pipefail
          base='https://yatrabus-india.pages.dev/api/v1'
          health="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/health")"
          printf '%s' "$health" | jq -e '.success == true and .data.schemaReady == true and .data.timetableCalendarReady == true' >/dev/null
          coverage="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/data/status")"
          printf '%s' "$coverage" | jq -e '.success == true and .data.administrativeDirectory.records >= 15000 and .data.busServiceData.routes > 0 and .data.busServiceData.timetables > 0' >/dev/null
          kolkata="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --get --data-urlencode 'q=Kolkata' --data-urlencode 'limit=8' "$base/places/search")"
          printf '%s' "$kolkata" | jq -e '.success == true and (.data | length > 0) and all(.data[]; ((.place.canonicalName // .canonicalName) != null) and ((.displayLabel // .canonicalName) != null))' >/dev/null
          terminal="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --get --data-urlencode 'q=Esplanade' --data-urlencode 'limit=8' "$base/places/search")"
          printf '%s' "$terminal" | jq -e '.success == true and any(.data[]; (.place.placeType // .placeType) == "bus_terminal")' >/dev/null
          nearby="$(curl --silent --show-error --retry 3 --retry-delay 2 --get --data-urlencode 'lat=22.5665' --data-urlencode 'lon=88.3500' --data-urlencode 'radius=8000' "$base/places/nearby")"
          printf '%s' "$nearby" | jq '{success, count:(.stops | length), meta, error}'
          routes="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$base/routes")"
          printf '%s' "$routes" | jq -e '.success == true and (.data | length > 0)' >/dev/null
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            places_ready=false
            for attempt in $(seq 1 15); do
              kolkata="$(curl --silent --show-error --max-time 10 --get --data-urlencode 'q=Kolkata' --data-urlencode 'limit=8' "$base/places/search" || true)"
              if printf '%s' "$kolkata" | jq -e '.success == true and (.data | length > 0) and all(.data[]; .place.canonicalName != null and .displayLabel != null and .matchType != null)' >/dev/null 2>&1; then
                places_ready=true
                break
              fi
              echo "Waiting for the new passenger autocomplete API (attempt $attempt/15)."
              sleep 10
            done
            if [ "$places_ready" != true ]; then
              echo "::error::Production autocomplete API did not switch to the PlaceSearchResult response shape."
              printf '%s\n' "$kolkata"
              exit 1
            fi

            route_pair="$(printf '%s' "$routes" | jq -er '[.data[] | select((.stops | length) >= 2) | {from: .stops[0].stopName, to: .stops[-1].stopName}] | first')"
            origin="$(printf '%s' "$route_pair" | jq -er '.from')"
            destination="$(printf '%s' "$route_pair" | jq -er '.to')"
            named_route="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --get --data-urlencode "from=$origin" --data-urlencode "to=$destination" "$base/routes/search")"
            printf '%s' "$named_route" | jq -e '.success == true and (.directRoutes | length > 0)' >/dev/null

            nearby_ready=false
            for attempt in $(seq 1 3); do
              nearby="$(curl --silent --show-error --max-time 65 --get --data-urlencode 'lat=22.5665' --data-urlencode 'lon=88.3500' --data-urlencode 'radius=8000' "$base/places/nearby" || true)"
              if printf '%s' "$nearby" | jq -e '.success == true and (.stops | length > 0) and (.meta.sources.openStreetMap > 0) and (.meta.timetableVerified == false)' >/dev/null 2>&1; then
                nearby_ready=true
                break
              fi
              echo "Waiting for nearby mapped stops from the deployed OSM fallback (attempt $attempt/3)."
              sleep 10
            done
            if [ "$nearby_ready" != true ]; then
              echo "::error::Production nearby endpoint returned no mapped bus stops."
              printf '%s\n' "$nearby" | jq '{success, count:(.stops | length), meta, error}' || true
              exit 1
            fi

            jhargram_nearby="$(curl --silent --show-error --max-time 30 --get --data-urlencode 'lat=22.43962' --data-urlencode 'lon=86.99267' --data-urlencode 'radius=5000' "$base/places/nearby" || true)"
            if ! printf '%s' "$jhargram_nearby" | jq -e '.success == true and any(.stops[]; .place.canonicalName == "Jhargram New Bus Stand" and .source == "OPENSTREETMAP" and .place.busServiceVerified == false)' >/dev/null 2>&1; then
              echo "::error::Jhargram New Bus Stand was not returned as an attributed, unverified mapped location."
              printf '%s\\n' "$jhargram_nearby" | jq '{success, stops, meta, error}' || true
              exit 1
            fi

          fi
          echo "Production API smoke test passed: India place data, autocomplete, Kolkata and Jhargram nearby stops, route directory and passenger name-based route search are reachable."
      - name: Type-check Cloudflare Pages Functions
        run: |
          find functions -name '*.ts' -print0 | xargs -0 npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --strict --skipLibCheck --lib ES2022,DOM
      - name: Test Super Admin cryptographic authentication
        run: npx tsx scripts/test-admin-auth.ts
      - name: Validate D1 migrations, search SQL and India LGD importer
        run: |
          set -euo pipefail
          python3 scripts/validate-d1-migration.py
          python3 tests/d1-route-stop-index.test.py
          python3 tests/d1-timetable-date-filter.test.py
          npx tsx scripts/test-service-calendar.ts
          node --check scripts/import-india-lgd-to-d1.mjs
          node scripts/import-india-lgd-to-d1.mjs --self-test
