name: Refresh public GTFS data

on:
  push:
    branches: [phase7-gtfs-public-data, phase7-india-coverage-expansion, phase8-additional-bus-feeds, phase9-rajkot-feed, phase10-final-release-hardening, phase11-permanent-gtfs-publication]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-gtfs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout GTFS importer
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install ZIP utility
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download, validate and normalize enabled feeds
        run: node scripts/gtfs-import.mjs
      - name: Upload normalized GTFS dataset snapshot
        uses: actions/upload-artifact@v6
        with:
          name: yatribus-public-gtfs-${{ github.run_number }}
          path: artifacts/gtfs/
          if-no-files-found: error
          retention-days: 30
      - name: Package validated snapshot
        run: tar -czf yatribus-gtfs-snapshot.tar.gz -C artifacts/gtfs .
      - name: Publish stable public GTFS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view gtfs-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create gtfs-latest --repo "$GITHUB_REPOSITORY" --title "YatraBus India — Latest validated GTFS snapshot" --notes "Automatically refreshed, validated static GTFS snapshot. See import-report.json inside the asset for source status, timestamps and record counts. Static schedules are not live GPS. Source licences and attribution travel with each feed."
          else
            gh release edit gtfs-latest --repo "$GITHUB_REPOSITORY" --title "YatraBus India — Latest validated GTFS snapshot" --notes "Latest successful refresh: workflow run $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT). See import-report.json inside the asset for source status, timestamps and record counts. Static schedules are not live GPS. Source licences and attribution travel with each feed."
          fi
          gh release upload gtfs-latest yatribus-gtfs-snapshot.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
