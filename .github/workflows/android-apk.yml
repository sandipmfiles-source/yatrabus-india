
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor plugin settings
        shell: bash
        run: |
          set -e

          test -f android/settings.gradle
          test -f android/capacitor.settings.gradle

          if ! grep -q "capacitor.settings.gradle" android/settings.gradle; then
            printf "\napply from: 'capacitor.settings.gradle'\n" >> android/settings.gradle
          fi

          if ! grep -q "capacitor-geolocation" android/capacitor.settings.gradle; then
            echo "ERROR: Geolocation plugin missing after Capacitor sync."
            cat android/capacitor.settings.gradle
            exit 1
          fi

          echo "Capacitor plugin settings verified."

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          cd android

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: Gradle wrapper properties file not found."
            exit 1
          fi

          sed -i 's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.2.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yatrabus-india-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
