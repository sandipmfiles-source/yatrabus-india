name: Build Android Debug APK

on:
  push:
    branches: [main, master, mx-local-preserve]
  pull_request:
    branches: [main, master, mx-local-preserve, phase1-final-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Resolve and lock NPM Dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from the resolved lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit NPM Dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const r=require('./npm-audit.json'); console.log('NPM vulnerability summary:', JSON.stringify(r.metadata?.vulnerabilities || r.error || {}, null, 2)); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', fixAvailable=' + JSON.stringify(item.fixAvailable));"
 
      - name: Upload Resolved NPM Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: yatribus-resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is not configured. Native APK API calls will fail closed until an HTTPS backend URL is configured."
          elif [[ "$VITE_API_BASE_URL" != https://* ]]; then
            echo "::error::VITE_API_BASE_URL must use HTTPS for Android builds."
            exit 1
          fi
          npm run build

      - name: Run Automated Test Suites
        run: npm test

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permissions for Gradle Wrapper
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Set up Gradle 8.14.3 for Capacitor 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          BUILD_CMD="./gradlew"
          if [ ! -f gradlew ]; then BUILD_CMD="gradle"; fi
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt of 3"
            if $BUILD_CMD assembleDebug --stacktrace; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution/build failed; retrying after 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Verify APK Binary Existence
        id: verify_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK file was not produced by Gradle build!"
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatribus-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload NPM Audit Report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: yatribus-npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Publish APK on GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/mx-local-preserve'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: yatribus-debug-apk
          path: release-assets

      - name: Publish downloadable GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yatribus-build-${{ github.run_number }}
          name: "YatraBus India APK build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: release-assets/app-debug.apk
          fail_on_unmatched_files: true

  sync-lockfile:
    name: Commit validated npm lockfile to Phase 1 branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase1-final-v3' && github.event.pull_request.head.repo.full_name == github.repository && needs.build-android.result == 'success'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the Phase 1 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download the lockfile validated by the build
        uses: actions/download-artifact@v4
        with:
          name: yatribus-resolved-package-lock
          path: generated-lock

      - name: Commit the validated lockfile
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cp generated-lock/package-lock.json package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "Committed package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync validated npm lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
