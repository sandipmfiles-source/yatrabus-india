name: Build Android Debug APK

on:
  push:
    branches: [main, master, mx-local-preserve]
  pull_request:
    branches: [main, master, mx-local-preserve]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Run Automated Test Suites
        run: npm test

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permissions for Gradle Wrapper
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Set up compatible Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          BUILD_CMD="./gradlew"
          if [ ! -f gradlew ]; then BUILD_CMD="gradle"; fi
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt of 3"
            if $BUILD_CMD assembleDebug --stacktrace; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution/build failed; retrying after 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Verify APK Binary Existence
        id: verify_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK file was not produced by Gradle build!"
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatribus-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish APK on GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/mx-local-preserve'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: yatribus-debug-apk
          path: release-assets

      - name: Publish downloadable GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yatribus-build-${{ github.run_number }}
          name: "YatraBus India APK build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: release-assets/app-debug.apk
          fail_on_unmatched_files: true
