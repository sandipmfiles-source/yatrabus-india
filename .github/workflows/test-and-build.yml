name: Tests & Verification Suite

on:
  push:
    branches: [main, master, phase5-production-readiness, phase6-final-qa, phase11-permanent-gtfs-publication, phase12-gtfs-runtime-integration]
  pull_request:
    branches: [main, master, phase10-final-release-hardening, phase11-permanent-gtfs-publication]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check GTFS Node scripts\n        run: |\n          node --check scripts/gtfs-import.mjs\n          node --check scripts/install-public-gtfs-snapshot.mjs\n\n      - name: Type-check backend and app\n        run: npx tsc --noEmit --pretty false\n\n      - name: Run Test Runner
        run: npm test

      - name: Verify TypeScript & Frontend Build
        run: npm run build
