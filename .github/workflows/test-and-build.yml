name: Tests & Verification Suite

on:
  push:
    branches: [main, master, phase5-production-readiness, phase6-final-qa, phase11-permanent-gtfs-publication, phase12-gtfs-runtime-integration, phase13-date-accurate-route-details, phase14-passenger-route-detail-ui, phase15-india-place-directory, phase16-bus-connected-place-filter, phase17-android-navigation-nearby-cleanup]
  pull_request:
    branches: [main, master, phase10-final-release-hardening, phase11-permanent-gtfs-publication, phase12-gtfs-runtime-integration, phase13-date-accurate-route-details, phase14-passenger-route-detail-ui, phase15-india-place-directory, phase16-bus-connected-place-filter]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check GTFS Node scripts
        run: |
          node --check scripts/gtfs-import.mjs
          node --check scripts/install-public-gtfs-snapshot.mjs
          node --check scripts/import-lgd-directory.mjs

      - name: Type-check backend and app
        run: npx tsc --noEmit --pretty false

      - name: Run Test Runner
        run: npm test

      - name: Verify TypeScript & Frontend Build
        run: npm run build
