name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yatribus-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate required release configuration
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" == https://* ]] || { echo "::error::Set repository variable VITE_API_BASE_URL to the deployed HTTPS API URL ending in /api."; exit 1; }
          [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in repository Actions secrets."; exit 1;
          }

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Install locked dependencies and run checks
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build
          npm test

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode protected release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/yatribus-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          sha256sum "$APK" "$AAB" | tee release-sha256.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yatribus-signed-release-${{ github.run_number }}
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}
            release-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed candidate as GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yatribus-release-candidate-${{ github.run_number }}
          name: "YatraBus India signed release candidate #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.APK }}
            ${{ env.AAB }}
            release-sha256.txt
