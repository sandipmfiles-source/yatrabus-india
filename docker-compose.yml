services:
  yatribus:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      PORT: 5000
      YATRIBUS_DATA_FILE: /app/data/yatribus-state.json
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      OWNER_JWT_SECRET: ${OWNER_JWT_SECRET:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - yatribus-data:/app/data
    restart: unless-stopped

volumes:
  yatribus-data:
